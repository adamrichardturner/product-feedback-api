services:
  db:
    image: postgres:16
    container_name: product_feedback_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5435}:5432"

  api:
    build: .
    container_name: product_feedback_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production.local
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
      PORT: ${PORT:-3005}
    ports:
      - "${PORT:-3005}:${PORT:-3005}"
    restart: unless-stopped

volumes:
  db-data:
